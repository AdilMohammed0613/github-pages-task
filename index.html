<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        header {
            background: #24292e;
            color: white;
            padding: 30px;
        }

        .container {
            padding: 50px 20px;
        }

        h1 {
            color: #24292e;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #444;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #24292e;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h2>DevOps Internship</h2>
    </header>

    <div class="container">
        <h1>Hello, GitHub Pages! 🚀</h1>

        <p>
            This is my first static website hosted using GitHub Pages.
        </p>

        <p>
            Task 6: Host a Static Website with GitHub Pages
        </p>

        <a href="https://github.com/" class="btn">
            Visit GitHub
        </a>
    </div>

    <footer>
        Created by Adil Mohammed
    </footer>

</body>
</html>
